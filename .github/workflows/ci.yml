name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. CI: Build, Testes, Lint e SAST
  # -------------------------------------------------------------
  ci:
    name: Build, Tests, Lint & SAST
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Instalar Dependências
        run: |
          go mod tidy
          go mod download

      - name: Build da Aplicação
        run: go build -v ./...

      - name: Testes Unitários
        run: go test -v -run TestUserService ./user/...

      - name: Testes de Integração
        env:
          TEST_DB_URL: postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: go test -v -run TestIntegrationPostgres ./user/...

      - name: Go Vet (Linter Nativo)
        run: go vet ./...

      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/security-audit
        continue-on-error: true

  # -------------------------------------------------------------
  # 2. Container: Lint, Build, Trivy e Push Docker Hub
  # -------------------------------------------------------------
  container:
    name: Docker Lint, Build, Scan & Push
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Dockerfile Linter (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3018

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local para Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: api-go-devops:scan

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-go-devops:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login no Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push para o Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-go-devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-go-devops:${{ github.sha }}

  # -------------------------------------------------------------
  # 3. CD: Deploy Staging & DAST (OWASP ZAP)
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging & DAST Scan
    runs-on: ubuntu-latest
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Disparar Deploy Hook no Render
        run: |
          if [ -n "${{ secrets.RENDER_STAGING_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_STAGING_HOOK }}"
          else
            echo "RENDER_STAGING_HOOK nao configurado. Pulando trigger manual."
          fi

      - name: Aguardar Deploy Estabilizar
        run: sleep 20

      - name: DAST Scan (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://api-go-devops.onrender.com/users'
        continue-on-error: true

  # -------------------------------------------------------------
  # 4. CD: Deploy Produção com Aprovação Manual
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy Production (Aprovacao Manual)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy Producao
        run: |
          echo "Deploy em Producao aprovado por revisor e concluido com sucesso!"