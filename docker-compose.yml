services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_go_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: usersdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - go-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_go_panel
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - go-network
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_go_app
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: usersdb
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - go-network
    depends_on:
      - postgres

networks:
  go-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local